<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta content="#0d0d10" name="theme-color" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>404 — Quentin Macq</title>
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-style: normal;
        font-weight: 200 800;
        font-stretch: 75% 100%;
        font-display: swap;
        src: url('/fonts/bricolage-grotesque-v9-latin.woff2') format('woff2');
      }

      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/jetbrains-mono-v24-latin.woff2') format('woff2');
      }

      :root {
        --ink: #0d0d10;
        --paper: #f5f1e8;
        --accent: #ff5b3a;
        --muted: rgba(245, 241, 232, 0.62);
        --faint: rgba(245, 241, 232, 0.52);
        --line: rgba(245, 241, 232, 0.12);
        --font-display: 'Bricolage Grotesque', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        --pad: clamp(1.5rem, 4vw, 3rem);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100dvh;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--font-display), sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: max(var(--pad), env(safe-area-inset-top))
          max(var(--pad), env(safe-area-inset-right)) max(var(--pad), env(safe-area-inset-bottom))
          max(var(--pad), env(safe-area-inset-left));
        background:
          radial-gradient(120% 80% at 90% -10%, rgba(255, 91, 58, 0.07), transparent 60%),
          radial-gradient(60% 60% at 0% 110%, rgba(212, 165, 116, 0.05), transparent 60%);
      }

      .top,
      .bottom {
        display: flex;
        align-items: center;
        gap: 1rem;
        font-family: var(--font-mono), monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .bottom {
        color: var(--faint);
      }

      .rule {
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      .brand {
        font-family: var(--font-display), sans-serif;
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        text-transform: none;
        color: var(--paper);
        text-decoration: none;
      }

      .brand span {
        color: var(--accent);
      }

      .center {
        max-width: 64ch;
        margin: auto 0;
      }

      .stroke {
        display: block;
        width: 2.5rem;
        height: 2px;
        margin-bottom: 2rem;
        background: var(--accent);
      }

      .code {
        margin: 0;
        font-weight: 700;
        font-stretch: 80%;
        font-size: clamp(6rem, 18vw, 14rem);
        line-height: 0.86;
        letter-spacing: -0.05em;
        color: var(--paper);
      }

      .code span {
        color: var(--accent);
      }

      h1 {
        margin: 1.5rem 0 1rem;
        font-weight: 600;
        font-size: clamp(1.75rem, 1.2rem + 2.4vw, 3rem);
        line-height: 1;
        letter-spacing: -0.035em;
      }

      p {
        max-width: 44ch;
        margin: 0 0 2.5rem;
        font-weight: 400;
        font-size: clamp(1.0625rem, 1rem + 0.4vw, 1.25rem);
        line-height: 1.45;
        color: var(--muted);
      }

      a.back {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 12px 22px;
        background: var(--accent);
        color: var(--ink);
        text-decoration: none;
        border-radius: 999px;
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        transition: background 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      a.back:hover {
        background: #e04a26;
      }

      a.back svg {
        transition: transform 360ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      a.back:hover svg {
        transform: translateX(3px);
      }
    </style>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/"><span>Q.</span>Macq</a>
      <span class="rule"></span>
      <span>404</span>
    </header>

    <main class="center">
      <span class="stroke" aria-hidden="true"></span>
      <p class="code">404<span>.</span></p>
      <h1>Cette page n'existe pas ou n'existe plus.</h1>
      <p>Lien périmé, faute de frappe, ou contenu déplacé.</p>
      <a class="back" href="/">
        <span>Retour à l'accueil</span>
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </a>
    </main>

    <footer class="bottom">
      <span>Quentin Macq · Hauts-de-France</span>
      <span class="rule"></span>
      <span>quentin-macq.dev</span>
    </footer>
  </body>
</html>
