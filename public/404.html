<!doctype html>
<html lang="fr" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta content="#0d0d10" name="theme-color" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>404 — Quentin Macq</title>
    <script src="/404.js"></script>
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-style: normal;
        font-weight: 200 800;
        font-stretch: 75% 100%;
        font-display: swap;
        src: url('/fonts/bricolage-grotesque-v9-latin.woff2') format('woff2');
      }

      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/jetbrains-mono-v24-latin.woff2') format('woff2');
      }

      :root {
        --ink: #0d0d10;
        --paper: #f5f1e8;
        --bg: var(--ink);
        --fg: var(--paper);
        --fg-muted: rgba(245, 241, 232, 0.62);
        --line: rgba(245, 241, 232, 0.12);
        --accent-text: #ff5b3a;
        --accent-button: #ff5b3a;
        --accent-deep: #e04a26;
        --font-display: 'Bricolage Grotesque', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        --pad: clamp(1.25rem, 2.5vw, 2.5rem);
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      :root.theme-light {
        --bg: var(--paper);
        --fg: var(--ink);
        --fg-muted: rgba(13, 13, 16, 0.72);
        --line: rgba(13, 13, 16, 0.1);
        --accent-text: #b8350f;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-display), sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(120% 80% at 90% -10%, rgba(255, 91, 58, 0.07), transparent 60%),
          radial-gradient(60% 60% at 0% 110%, rgba(212, 165, 116, 0.05), transparent 60%), var(--bg);
      }

      .container {
        width: 100%;
        max-width: 1280px;
        margin-inline: auto;
        padding-inline: max(var(--pad), env(safe-area-inset-left))
          max(var(--pad), env(safe-area-inset-right));
      }

      .top {
        padding-block: 18px;
      }

      .brand {
        font-weight: 600;
        font-size: 1.0625rem;
        letter-spacing: -0.03em;
        color: var(--fg);
        text-decoration: none;
      }

      .brand span {
        color: var(--accent-text);
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        padding-block: clamp(3rem, 10vh, 6rem);
      }

      .code {
        margin: 0;
        font-weight: 700;
        font-stretch: 80%;
        font-size: clamp(6rem, 18vw, 14rem);
        line-height: 0.86;
        letter-spacing: -0.05em;
        color: var(--fg);
      }

      .code .stop {
        color: var(--accent-text);
      }

      h1 {
        max-width: 30ch;
        margin: clamp(1.25rem, 2.6vw, 2rem) 0 0;
        font-weight: 400;
        font-size: clamp(1.25rem, 1rem + 1.1vw, 1.875rem);
        line-height: 1.3;
        letter-spacing: -0.015em;
      }

      p.lede {
        max-width: 44ch;
        margin: 0.75rem 0 0;
        font-size: clamp(1.0625rem, 1rem + 0.4vw, 1.25rem);
        line-height: 1.45;
        color: var(--fg-muted);
      }

      a.back {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: clamp(1.75rem, 3vw, 2.5rem);
        padding: 12px 22px;
        background: var(--accent-button);
        color: var(--ink);
        text-decoration: none;
        border: 1px solid var(--accent-button);
        border-radius: 999px;
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        transition: background 180ms var(--ease-out);
      }

      a.back svg {
        transition: transform 360ms var(--ease-out);
      }

      @media (hover: hover) {
        a.back:hover {
          background: var(--accent-deep);
          border-color: var(--accent-deep);
        }

        a.back:hover svg {
          transform: translateX(3px);
        }
      }

      footer {
        padding-block: clamp(1.75rem, 3vw, 2.5rem)
          max(clamp(1.75rem, 3vw, 2.5rem), env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
      }

      footer .container {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: center;
        gap: 0.75rem 2rem;
      }

      footer span {
        font-family: var(--font-mono), monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-align: center;
      }

      footer span + span {
        color: var(--fg-muted);
      }

      :focus-visible {
        outline: 2px solid var(--accent-text);
        outline-offset: 2px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="container">
        <a class="brand" href="/" data-en-href="/en/"><span>Q.</span>Macq</a>
      </div>
    </header>

    <main>
      <div class="container">
        <p class="code">404<span class="stop">.</span></p>
        <h1 data-en="This page doesn't exist, or no longer does.">
          Cette page n'existe pas ou n'existe plus.
        </h1>
        <p class="lede" data-en="Stale link, typo, or moved content.">
          Lien périmé, faute de frappe, ou contenu déplacé.
        </p>
        <a class="back" href="/" data-en-href="/en/">
          <span data-en="Back to home">Retour à l'accueil</span>
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </a>
      </div>
    </main>

    <footer>
      <div class="container">
        <span>Quentin Macq</span>
        <span data-en="Hosted by Cloudflare, Inc. · 101 Townsend St, San Francisco, CA 94107, USA"
          >Hébergé par Cloudflare, Inc. · 101 Townsend St, San Francisco, CA 94107, USA</span
        >
      </div>
    </footer>
  </body>
</html>
