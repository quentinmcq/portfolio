<!doctype html>
<html lang="fr" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta content="#0d0d10" name="theme-color" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />

    <script>
      document.documentElement.classList.add('js')

      try {
        // Prerendered pages name their translation in data-twin.
        const twin = document.documentElement.dataset.twin
        const lang = localStorage.getItem('lang')

        if (twin && (lang === 'en' || lang === 'fr') && lang !== document.documentElement.lang) {
          location.replace(twin + location.hash)
        }

        const theme = localStorage.getItem('theme')
        const light =
          theme === 'light' || (!theme && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.toggle('theme-light', light)
        document.documentElement.classList.toggle('theme-dark', !light)

        if (light) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f1e8')
        }
      } catch (e) {}

      // Cookieless audience measure, on the live site only so that local runs and tests are never counted.
      if (location.hostname === 'quentin-macq.dev') {
        const beacon = document.createElement('script')
        beacon.defer = true
        beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js'
        beacon.dataset.cfBeacon = '{"token": "1fd72f4be68f4072a84f9260922246a3"}'
        document.head.append(beacon)
      }
    </script>

    <title>Quentin Macq — Développeur full-stack</title>

    <meta
      name="description"
      content="Quentin Macq — développeur full-stack chez Motoblouz. Nuxt, Vue, TypeScript, Symfony. Hauts-de-France."
    />
    <link rel="canonical" href="https://quentin-macq.dev/" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quentin-macq.dev/" />
    <meta property="og:title" content="Quentin Macq — Développeur full-stack" />
    <meta
      property="og:description"
      content="Développeur full-stack chez Motoblouz. Nuxt, Vue, TypeScript, Symfony. Hauts-de-France."
    />
    <meta property="og:image" content="https://quentin-macq.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Quentin Macq, développeur full-stack chez Motoblouz, Hauts-de-France."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quentin Macq — Développeur full-stack" />
    <meta
      name="twitter:description"
      content="Développeur full-stack chez Motoblouz. Nuxt, Vue, TypeScript, Symfony. Hauts-de-France."
    />
    <meta name="twitter:image" content="https://quentin-macq.dev/og.png" />
    <meta
      name="twitter:image:alt"
      content="Quentin Macq, développeur full-stack chez Motoblouz, Hauts-de-France."
    />
  </head>

  <body>
    <div id="app"></div>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
